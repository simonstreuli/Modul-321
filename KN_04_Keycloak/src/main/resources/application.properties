# Application Settings
spring.application.name=keycloak-oidc-demo
server.port=8080

# Keycloak OAuth2 Client Configuration
spring.security.oauth2.client.registration.keycloak.client-id=demo-client
# IMPORTANT: Replace with actual client secret from Keycloak or use environment variable
# For production, use: ${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Keycloak Provider Configuration
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://keycloak:8080/realms/demo-realm
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# Logging (for development/demo only - disable in production)
# logging.level.org.springframework.security=DEBUG
# logging.level.org.springframework.security.oauth2=DEBUG
logging.level.root=INFO
